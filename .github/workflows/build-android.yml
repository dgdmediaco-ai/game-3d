name: Build 3D Rush APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. DOWNLOAD PROJECT
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # 2. JAVA 17
      # ==============================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==============================
      # 3. ANDROID SDK
      # ==============================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"


      # ==============================
      # 4. DOWNLOAD GODOT 4.5.1
      # ==============================
      - name: Download Godot
        run: |
          wget -q \
          https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip

          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip

          mv Godot_v4.5.1-stable_linux.x86_64 godot

          chmod +x godot

          ./godot --version


      # ==============================
      # 5. INSTALL GODOT EXPORT TEMPLATES
      # ==============================
      - name: Install Godot Export Templates
        run: |
          wget -q \
          https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz

          mkdir -p /tmp/godot_templates

          unzip -q \
          Godot_v4.5.1-stable_export_templates.tpz \
          -d /tmp/godot_templates

          mkdir -p \
          "$HOME/.local/share/godot/export_templates/4.5.1.stable"

          DEBUG=$(find /tmp/godot_templates \
            -type f \
            -name "android_debug.apk" \
            -print -quit)

          RELEASE=$(find /tmp/godot_templates \
            -type f \
            -name "android_release.apk" \
            -print -quit)

          if [ -z "$DEBUG" ]; then
            echo "ERROR: Android debug template not found"
            find /tmp/godot_templates -type f
            exit 1
          fi

          if [ -z "$RELEASE" ]; then
            echo "ERROR: Android release template not found"
            find /tmp/godot_templates -type f
            exit 1
          fi

          cp "$DEBUG" \
          "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"

          cp "$RELEASE" \
          "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_release.apk"

          echo "Android templates installed!"

          ls -lh \
          "$HOME/.local/share/godot/export_templates/4.5.1.stable/"


      # ==============================
      # 6. CONFIGURE GODOT
      # ==============================
      - name: Configure Godot Android
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

          echo "Java SDK:"
          echo "$JAVA_HOME"

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"


      # ==============================
      # 7. CHECK PROJECT
      # ==============================
      - name: Check Project
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""

          if [ ! -f "project.godot" ]; then
            echo "ERROR: project.godot not found!"
            exit 1
          fi

          if [ ! -f "export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg not found!"
            exit 1
          fi

          echo "project.godot FOUND"
          echo "export_presets.cfg FOUND"


      # ==============================
      # 8. SHOW PRESET
      # ==============================
      - name: Check Android Preset
        run: |
          echo "Android presets detected:"

          grep 'name=' export_presets.cfg

          echo ""

          echo "Android preset configuration:"
          cat export_presets.cfg


      # ==============================
      # 9. IMPORT GODOT PROJECT
      # ==============================
      - name: Import Project
        run: |
          ./godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --quit


      # ==============================
      # 10. EXPORT APK
      # ==============================
      - name: Export Android APK
        run: |
          mkdir -p builds

          echo "Starting Android export..."

          ./godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/builds/3D_Rush.apk"


      # ==============================
      # 11. VERIFY APK
      # ==============================
      - name: Verify APK
        run: |
          echo "Checking APK..."

          if [ ! -f "$GITHUB_WORKSPACE/builds/3D_Rush.apk" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "       APK BUILD SUCCESSFUL!"
          echo "======================================"
          echo ""

          ls -lh "$GITHUB_WORKSPACE/builds/3D_Rush.apk"


      # ==============================
      # 12. UPLOAD APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Rush-APK
          path: builds/3D_Rush.apk
