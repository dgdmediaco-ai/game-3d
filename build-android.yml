name: Build 3D Rush APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q Godot_v4.5.1-stable_export_templates.tpz -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          if [ -d "$HOME/.local/share/godot/export_templates/4.5.1.stable/templates" ]; then
            mv "$HOME/.local/share/godot/export_templates/4.5.1.stable/templates/"* "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          fi

      - name: Import project
        run: ./godot --headless --path . --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p builds
          ./godot --headless --path . --export-debug "Android" builds/3D_Rush.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Rush-APK
          path: builds/3D_Rush.apk
